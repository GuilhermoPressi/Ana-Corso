server {
    listen 80;
    server_name _;

    # Anexos do WhatsApp (até 10 MB) e fotos vão em base64 no JSON (~+35%).
    # O padrão do nginx é 1 MB, o que gerava 413 ao anexar imagens.
    client_max_body_size 20m;

    # Proxy API requests to saas-ana-api service
    location /api {
        proxy_pass http://saas-ana-api:3000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_error;
    }

    location @api_error {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Não foi possível conectar ao servidor. Tente novamente em alguns instantes."}}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # O index.html aponta para os arquivos com hash da versão atual: o navegador
    # precisa revalidá-lo sempre, senão continua pedindo chunks de um deploy antigo.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Arquivos gerados pelo Vite têm hash no nome: podem ficar em cache para sempre.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
